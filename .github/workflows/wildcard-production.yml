name: wildcard-production-package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanqi-wildcard-production-package
  cancel-in-progress: false

jobs:
  issue-encrypt-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      ROOT_DOMAIN: 37psychology.cn
      ACME_SERVER: https://acme-v02.api.letsencrypt.org/directory
      ACME_COMMIT: 3661fd86b6304115e42f43910e6dd452ab9866d6
      Tencent_SecretId: ${{ secrets.TENCENT_SECRET_ID }}
      Tencent_SecretKey: ${{ secrets.TENCENT_SECRET_KEY }}
      SMA_TLS_PACKAGE_PASSPHRASE: ${{ secrets.SMA_TLS_PACKAGE_PASSPHRASE }}

    steps:
      - name: Checkout pinned workflow source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Validate required secrets and package crypto
        shell: bash
        run: |
          set -euo pipefail
          for name in Tencent_SecretId Tencent_SecretKey SMA_TLS_PACKAGE_PASSPHRASE; do
            [[ -n "${!name}" ]] || {
              echo "::error::Required Repository Secret is missing: $name"
              exit 1
            }
          done
          [[ "${#SMA_TLS_PACKAGE_PASSPHRASE}" -ge 32 ]] || {
            echo "::error::SMA_TLS_PACKAGE_PASSPHRASE must be at least 32 characters."
            exit 1
          }
          command -v openssl >/dev/null
          command -v tar >/dev/null
          echo "PACKAGE_CRYPTO_PREFLIGHT=PASS"

      - name: Issue Let's Encrypt production wildcard certificate
        shell: bash
        env:
          WORK_ROOT: ${{ runner.temp }}/sanqi-tls-production
        run: |
          set -euo pipefail
          chmod +x scripts/issue-wildcard.sh
          scripts/issue-wildcard.sh

      - name: Create encrypted certificate package
        shell: bash
        env:
          WORK_ROOT: ${{ runner.temp }}/sanqi-tls-production
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/sanqi-tls-package"
          install -d -m 0700 "$package_dir"

          output="$WORK_ROOT/output"
          key="$output/wildcard-$ROOT_DOMAIN.key"
          chain="$output/wildcard-$ROOT_DOMAIN.fullchain.pem"
          [[ -f "$key" && -f "$chain" ]]

          tar -C "$output" -czf "$package_dir/payload.tar.gz" \
            "wildcard-$ROOT_DOMAIN.key" \
            "wildcard-$ROOT_DOMAIN.fullchain.pem"

          printf '%s' "$SMA_TLS_PACKAGE_PASSPHRASE" >"$package_dir/passphrase"
          chmod 0600 "$package_dir/passphrase"

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -md sha256 \
            -in "$package_dir/payload.tar.gz" \
            -out "$package_dir/sanqi-tls-production.tar.gz.enc" \
            -pass file:"$package_dir/passphrase"

          rm -f "$package_dir/payload.tar.gz" "$package_dir/passphrase"

          test -s "$package_dir/sanqi-tls-production.tar.gz.enc"
          sha256sum "$package_dir/sanqi-tls-production.tar.gz.enc" \
            >"$package_dir/sanqi-tls-production.tar.gz.enc.sha256"

          printf '%s\n' \
            'Encrypted Sanqi TLS production certificate package.' \
            'The decryption passphrase is NOT stored in this artifact.' \
            'Copy sanqi-tls-production.tar.gz.enc to the SMA server.' \
            'Decrypt on the server, then pipe the plaintext tar.gz into:' \
            '/usr/local/sbin/sanqi-tls-receive' \
            >"$package_dir/INSTALL.txt"

          echo "ENCRYPTED_TLS_PACKAGE=PASS"

      - name: Upload encrypted TLS package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sanqi-tls-production-encrypted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sanqi-tls-package/sanqi-tls-production.tar.gz.enc
            ${{ runner.temp }}/sanqi-tls-package/sanqi-tls-production.tar.gz.enc.sha256
            ${{ runner.temp }}/sanqi-tls-package/INSTALL.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Clean ephemeral private material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/sanqi-tls-production" "$RUNNER_TEMP/sanqi-tls-package"
          echo "Certificate private key, plaintext package, and passphrase file removed from runner."
